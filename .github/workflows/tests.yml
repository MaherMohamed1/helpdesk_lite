name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r helpdesk/requirements.txt

    - name: Run smoke tests
      run: |
        cd helpdesk
        python ../smoke_test.py

    - name: Lint with flake8
      continue-on-error: true
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 helpdesk/server/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-code treats all errors as warnings
        flake8 helpdesk/server/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
