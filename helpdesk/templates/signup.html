<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk Lite — Sign Up</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <div class="header-inner">
            <a href="/login" class="logo">🎫 HelpDesk Lite</a>
            <div class="header-actions">
                <a href="/login" class="btn btn-secondary">Login</a>
                <a href="/signup" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </header>

    <main class="centered">
        <div class="form-card">
            <h2>Create an Account</h2>
            <p class="form-subtitle">Register a new user to manage tickets in HelpDesk Lite.</p>
            <p class="form-note">New signups are created as employee users by default.</p>

            {% if error %}
            <div class="form-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('signup') }}">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <div class="field">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>
        </div>
    </main>
</body>

</html>
